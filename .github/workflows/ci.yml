name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Local medallion validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run reproducible local demo
        run: python scripts/run_local_demo.py

      - name: Verify generated data and dbt artifacts are not tracked
        run: |
          test -z "$(git ls-files data)"
          test -z "$(git ls-files '**/*.duckdb')"
          test -z "$(git ls-files dbt/target dbt/dbt_packages)"

      - name: Upload local verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-demo-evidence
          path: |
            outputs/local_demo/verification.md
            outputs/local_demo/execution.json
            outputs/local_demo/metrics.json
            outputs/local_demo/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload dbt diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-diagnostics
          path: |
            dbt/logs/dbt.log
            dbt/target/run_results.json
            dbt/target/manifest.json
          if-no-files-found: ignore
          retention-days: 7
