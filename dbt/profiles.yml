# Local + CI profile. DuckDB needs no credentials, so this file is safe to commit.
# Other warehouse targets require an adapter/profile and target-specific validation.
# Snowflake portability macros are included; see dbt/README.md.
sales_marketing:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'dbt/target/sales_marketing.duckdb') }}"
      threads: 4
