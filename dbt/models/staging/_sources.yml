version: 2

# These six tables are loaded from the committed fixtures in dbt/seeds/.
# Run dbt seed before dbt build: sources do not depend on seed nodes in the DAG.
# The pandas pipeline separately consumes generated CSVs under data/source/.
sources:
  - name: raw
    schema: raw
    description: "Synthetic operational CRM and marketing extracts (CSV)."
    tables:
      - name: customers
        description: "Customer master records from the synthetic CRM."
        columns:
          - name: customer_id
            description: "Business key for a customer."
            data_tests: [not_null]
      - name: products
        description: "Product catalog with pricing and plan tiers."
        columns:
          - name: product_id
            data_tests: [not_null]
      - name: campaigns
        description: "Marketing campaign definitions."
        columns:
          - name: campaign_id
            data_tests: [not_null]
      - name: orders
        description: "Order line transactions."
        columns:
          - name: order_id
            data_tests: [not_null]
      - name: ad_spend
        description: "Daily advertising spend and conversion metrics by campaign/channel."
        columns:
          - name: spend_id
            data_tests: [not_null]
      - name: support_tickets
        description: "Customer support tickets with satisfaction and resolution times."
        columns:
          - name: ticket_id
            data_tests: [not_null]
